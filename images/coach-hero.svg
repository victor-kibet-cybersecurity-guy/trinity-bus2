<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="60%" stop-color="#0E244E"/>
      <stop offset="100%" stop-color="#1A3B70"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Decorative Highway Grid & Glow -->
  <circle cx="1280" cy="220" r="300" fill="#F59E0B" opacity="0.12" filter="url(#glow)"/>
  <path d="M0 720L1600 720" stroke="#F59E0B" stroke-width="4" opacity="0.4"/>
  <rect x="0" y="722" width="1600" height="178" fill="#091325"/>

  <!-- Highway Lane Stripes -->
  <path d="M0 810 H200 M300 810 H500 M600 810 H800 M900 810 H1100 M1200 810 H1400 M1500 810 H1600" stroke="#F59E0B" stroke-width="8" stroke-dasharray="80 40" opacity="0.6"/>

  <!-- Coach Shadow -->
  <ellipse cx="850" cy="740" rx="680" ry="35" fill="#000" opacity="0.65"/>

  <!-- Main Coach Body (Executive Express Coach) -->
  <g transform="translate(180, 240)">
    <!-- Main Shell -->
    <path d="M60 160 C90 60 220 50 320 50 H1150 C1220 50 1260 80 1280 140 L1320 380 C1330 420 1310 460 1260 460 H100 C60 460 40 420 40 370 Z" fill="url(#busBody)"/>
    
    <!-- Brand Stripe Accent -->
    <path d="M50 320 Q 300 280 600 320 T 1300 300 L 1310 370 Q 700 390 50 370 Z" fill="url(#goldGold)"/>
    <path d="M60 375 H1280 L1270 410 H70 Z" fill="#0B1736"/>
    
    <!-- Large Panoramic Windows -->
    <path d="M280 80 H1180 C1220 80 1240 100 1250 140 L1265 240 C1265 250 1255 260 1245 260 H260 C250 260 240 250 245 240 L265 100 C270 88 275 80 280 80 Z" fill="url(#glass)"/>

    <!-- Window Dividers & Passengers silhouettes -->
    <line x1="420" y1="80" x2="410" y2="260" stroke="#0B1736" stroke-width="6"/>
    <line x1="580" y1="80" x2="570" y2="260" stroke="#0B1736" stroke-width="6"/>
    <line x1="740" y1="80" x2="730" y2="260" stroke="#0B1736" stroke-width="6"/>
    <line x1="900" y1="80" x2="890" y2="260" stroke="#0B1736" stroke-width="6"/>
    <line x1="1060" y1="80" x2="1050" y2="260" stroke="#0B1736" stroke-width="6"/>

    <!-- Passenger & Reclining Seat Silhouettes inside windows -->
    <circle cx="340" cy="160" r="18" fill="#334155"/>
    <path d="M320 210 Q 350 180 370 230" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>

    <circle cx="500" cy="160" r="18" fill="#334155"/>
    <path d="M480 210 Q 510 180 530 230" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>

    <circle cx="660" cy="160" r="18" fill="#334155"/>
    <circle cx="820" cy="160" r="18" fill="#334155"/>
    <circle cx="980" cy="160" r="18" fill="#334155"/>

    <!-- Front Windshield -->
    <path d="M125 150 C140 85 200 80 260 80 L245 260 H115 C100 260 110 200 125 150 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
    
    <!-- Driver Silhouette -->
    <circle cx="180" cy="170" r="20" fill="#F59E0B"/>
    <path d="M150 240 C160 200 200 200 210 240" fill="#38BDF8"/>
    
    <!-- Headlights & LED Daytime Running Lights -->
    <polygon points="50,340 100,320 100,360 45,370" fill="#38BDF8" filter="url(#glow)"/>
    <path d="M35 365 L-120 320 L-120 440 Z" fill="#38BDF8" opacity="0.25"/>

    <!-- Luggage Compartment Doors -->
    <rect x="350" y="380" width="180" height="60" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="560" y="380" width="180" height="60" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="770" y="380" width="180" height="60" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Handles -->
    <rect x="420" y="425" width="40" height="6" rx="3" fill="#F59E0B"/>
    <rect x="630" y="425" width="40" height="6" rx="3" fill="#F59E0B"/>
    <rect x="840" y="425" width="40" height="6" rx="3" fill="#F59E0B"/>

    <!-- Trinity Bus Express Branding Text on Side -->
    <text x="500" y="310" font-family="system-ui, sans-serif" font-weight="900" font-size="42" fill="#0B1736" letter-spacing="2">TRINITY BUS EXPRESS</text>

    <!-- Heavy Duty Coach Wheels -->
    <!-- Front Wheel -->
    <g transform="translate(260, 440)">
      <circle cx="0" cy="0" r="68" fill="#0F172A"/>
      <circle cx="0" cy="0" r="48" fill="#334155"/>
      <circle cx="0" cy="0" r="28" fill="#64748B"/>
      <circle cx="0" cy="0" r="12" fill="#F59E0B"/>
      <circle cx="-16" cy="-16" r="4" fill="#94A3B8"/>
      <circle cx="16" cy="-16" r="4" fill="#94A3B8"/>
      <circle cx="16" cy="16" r="4" fill="#94A3B8"/>
      <circle cx="-16" cy="16" r="4" fill="#94A3B8"/>
    </g>

    <!-- Rear Dual Axle Wheels -->
    <g transform="translate(980, 440)">
      <circle cx="0" cy="0" r="68" fill="#0F172A"/>
      <circle cx="0" cy="0" r="48" fill="#334155"/>
      <circle cx="0" cy="0" r="28" fill="#64748B"/>
      <circle cx="0" cy="0" r="12" fill="#F59E0B"/>
    </g>

    <g transform="translate(1120, 440)">
      <circle cx="0" cy="0" r="68" fill="#0F172A"/>
      <circle cx="0" cy="0" r="48" fill="#334155"/>
      <circle cx="0" cy="0" r="28" fill="#64748B"/>
      <circle cx="0" cy="0" r="12" fill="#F59E0B"/>
    </g>
  </g>
</svg>
